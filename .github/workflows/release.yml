name: Build & Release Chibiori macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build and Package Chibiori.app
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create DMG and ZIP Archives
        run: |
          ditto -c -k --keepParent "Chibiori.app" "Chibiori.zip"
          hdiutil create -volname "Chibiori" -srcfolder "Chibiori.app" -ov -format UDZO "Chibiori.dmg"
          ls -lh Chibiori.zip Chibiori.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "Chibiori Release ${{ github.event.inputs.version_tag || github.ref_name }}"
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            Chibiori.zip
            Chibiori.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
